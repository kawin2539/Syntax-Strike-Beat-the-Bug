name: Deploy Syntax Strike to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  validate-project:
    name: "1. Validate Project & HTML File"
    runs-on: ubuntu-latest
    steps:
      - name: "1.1 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "1.2 Check index.html Existence"
        run: |
          if [ -f "index.html" ]; then
            echo "✅ FOUND: index.html is present in root directory."
          else
            echo "❌ ERROR: index.html NOT found in root directory!"
            exit 1
          fi

  prepare-artifact:
    name: "2. Prepare Web Artifacts"
    needs: validate-project
    runs-on: ubuntu-latest
    steps:
      - name: "2.1 Checkout Source Code"
        uses: actions/checkout@v4

      - name: "2.2 Setup GitHub Pages Environment"
        uses: actions/configure-pages@v5

      - name: "2.3 Package & Upload Site Artifact"
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy-site:
    name: "3. Deploy to GitHub Pages"
    needs: prepare-artifact
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "3.1 Deploy Web App"
        id: deployment
        uses: actions/deploy-pages@v4
